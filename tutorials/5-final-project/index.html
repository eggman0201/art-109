<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EPHEMERA</title>
    <link rel="stylesheet" href="css/style.css">
</head>

<body>
    <main class="stage">
        <div class="visible">
            <div id="main">
                EVERYTHING<br>IS<br>EPHEMERAL
            </div>
            <div class="button">
                    <input type="file" id="file" multiple="multiple" accept="image/png, image/jpg, image/jpeg">
                    <label for="file">
                        <span class="button">ADD TO THE PILE</span>
                    </label>
            </div>
            <form class="saved-form">
                <div class="header">
                    <div class="saved-div"></div>
                </div>
            </form>
        </div>
        <div id="blurb1" class="hidden floaters">
            THIS NO LONGER BELONGS TO YOU
        </div>
        <div id="blurb2" class="hidden floaters">
            THIS IS NOT YOURS
        </div>
        <div id="blurb3" class="hidden floaters">
            MORE
        </div>
    </main>
    <script src="js/main.js"></script>
</body>

</html>
