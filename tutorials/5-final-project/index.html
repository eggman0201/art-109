<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EPHEMERA</title>
    <link rel="stylesheet" href="css/style.css">
</head>

<body>
    <div class="commentlmao">
        tried using a fade in tut from this video (https://www.youtube.com/watch?v=ybhlTIlUbO4) but just got misery that didnt work isntead
    </div>
    <style>
        .commentlmao {
            display: none;
        }
        #eyeball {
            position: absolute;
            width: 100vw;
            height: 100vh;
            opacity: 0;
        }

        .ghost {

            transition: 10s;
            opacity: 1;
        }
    </style>
    <script>
        function fadeIn() {
            document.getElementById("eyeball").className = "ghost";
        }
    </script>

    <main class="stage">
        <div class="visible">
            <div id="main">
                EVERYTHING<br>IS<br>EPHEMERAL
            </div>
            <div class="input-div button">
                <input type="file" id="file" multiple="multiple" accept="image/png, image/jpg, image/jpeg">
                <label for="file">
                    <span class="button">ADD TO THE PILE</span>
                </label>
            </div>
            <div id="queued-form">
                <div class="queued-div"></div>
            </div>
            <div id="eyeball"><img src="image/eyeball.png" onload="fadeIn()">
            </div>
            <script src="js/main.js"></script>
        </div>
    </main>
</body>


</html>
